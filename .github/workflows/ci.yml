name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Testes das regras de estoque (Python)
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes das regras de negócio
        run: node --test tests/model.test.mjs

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar ferramentas do emulador (efêmero, sem package.json)
        run: npm install --no-save firebase@13 @firebase/rules-unit-testing@5 firebase-tools@15
      - name: Testes das regras do Firestore (emulador descartável)
        run: npx firebase emulators:exec --only firestore --project demo-oenzoa-estoque 'node tests/firestore.rules.test.mjs'
